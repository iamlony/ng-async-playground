<h1>Async Playground</h1>
<p class="muted">Observable &rarr; Promise &rarr; rxResource &rarr; SignalStore</p>

<div class="layout">
  <main>
    <!-- 1. Observable: Suchfeld mit debounce + switchMap -->
    <app-user-search (userSelected)="selectedUser.set($event)" />

    <!-- 2. Promise: Posts des gewaehlten Users (3. rxResource steckt darin) -->
    @for (user of selectedUsers(); track user.id) {
      <app-post-list [user]="user" />
    } @empty {
      <section class="card">
        <p class="muted">Waehle oben einen User, um seine Posts zu sehen.</p>
      </section>
    }
  </main>

  <!-- 4. SignalStore: gelikte Posts -->
  <app-favorites />
</div>

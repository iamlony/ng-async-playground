<h1>Async Playground</h1>
<p class="muted">Observable &rarr; Promise &rarr; rxResource &rarr; SignalStore</p>

<div class="layout">
  <main>
    @if (selectedUser(); as user) {
      <!-- Ansicht 2: Posts des gewaehlten Users -->
      <button class="link back" (click)="selectedUser.set(null)">&larr; Zurueck zur Suche</button>
      <app-post-list [user]="user" />
    } @else {
      <!-- Ansicht 1: Suche -->
      <app-user-search (userSelected)="selectedUser.set($event)" />
    }
  </main>

  <!-- Immer sichtbar: gelikte Posts aus dem SignalStore -->
  <app-favorites />
</div>
